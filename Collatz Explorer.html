<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Collatz Explorer</title>
<style>
:root{--bg:#fff;--fg:#1c1c1e;--muted:#6b7280;--card:#f6f7f9;--border:#d7dbe0;--accent:#2b6cb0;--grid:#e5e7eb;--ok:#2f9e44;--bad:#e03131;--warn:#f08c00;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#16181c;--fg:#e8eaed;--muted:#9aa0a6;--card:#1f2227;--border:#3a3f47;--accent:#6aa9ff;--grid:#2c3037;--ok:#51cf66;--bad:#ff6b6b;--warn:#ffa94d}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#16181c;--fg:#e8eaed;--muted:#9aa0a6;--card:#1f2227;--border:#3a3f47;--accent:#6aa9ff;--grid:#2c3037;--ok:#51cf66;--bad:#ff6b6b;--warn:#ffa94d}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:980px;margin:0 auto;padding:16px}
h1{font-size:1.4rem;margin:.2em 0 .1em}
.sub{color:var(--muted);margin:0 0 14px}
.tabs{display:flex;gap:6px;border-bottom:1px solid var(--border);margin-bottom:14px}
.tabs button{background:none;border:0;border-bottom:3px solid transparent;color:var(--muted);padding:9px 14px;font:inherit;cursor:pointer}
.tabs button[aria-selected="true"]{color:var(--fg);border-color:var(--accent);font-weight:600}
.row{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-bottom:10px}
label{display:flex;align-items:center;gap:6px}
input[type=text]{background:var(--card);color:var(--fg);border:1px solid var(--border);border-radius:8px;padding:8px 10px;font:inherit;width:11.5em;max-width:100%}
button.b{background:var(--accent);color:#fff;border:0;border-radius:8px;padding:8px 14px;font:inherit;cursor:pointer}
button.b.s{background:var(--card);color:var(--fg);border:1px solid var(--border)}
button:disabled{opacity:.5;cursor:default}
#plot{position:relative;height:min(58vh,420px);min-height:260px;border:1px solid var(--border);border-radius:10px;background:var(--bg)}
#plot canvas{position:absolute;inset:0;width:100%;height:100%}
.info{margin:10px 0 2px}.hint{color:var(--muted);min-height:1.4em}
pre{margin:0;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:10px;height:min(42vh,340px);overflow:auto;font:13px/1.4 ui-monospace,Consolas,monospace}
progress{width:100%;height:10px;margin:10px 0 4px}
.ok{color:var(--ok)}.bad{color:var(--bad)}.warn{color:var(--warn)}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
<h1>Collatz Explorer</h1>
<p class="sub">Conjetura de Collatz (3n+1): si n es par se divide entre 2, si es impar se calcula 3n+1. ¿Se llega siempre a 1?</p>
<div class="tabs" role="tablist">
  <button role="tab" aria-selected="true" data-tab="seq">Secuencia de un número</button>
  <button role="tab" aria-selected="false" data-tab="rng">Comprobar un rango</button>
</div>

<section id="seq">
  <div class="row">
    <label>Número <input id="n" type="text" value="27" inputmode="text" autocomplete="off"></label>
    <button class="b" id="go">Calcular</button>
    <label><input type="checkbox" id="log"> Escala logarítmica</label>
  </div>
  <div class="hint">Admite potencias y operaciones simples: 10**100, 2^64-1, 1.000.000</div>
  <div id="plot"><canvas id="cv"></canvas><canvas id="ov"></canvas></div>
  <div class="info" id="info"></div>
  <div class="hint" id="hov">Pasa el cursor (o el dedo) sobre la gráfica para ver cada valor.</div>
</section>

<section id="rng" hidden>
  <div class="row">
    <label>Desde <input id="ini" type="text" value="1" autocomplete="off"></label>
    <label>Hasta <input id="fin" type="text" value="100000" autocomplete="off"></label>
    <button class="b" id="run">Comprobar</button>
    <button class="b s" id="stop" disabled>Parar</button>
  </div>
  <div class="row">
    <label><input type="checkbox" id="fast"> Modo rápido (solo verifica, mucho más veloz)</label>
    <label><input type="checkbox" id="showok" checked> Listar también los que convergen</label>
  </div>
  <pre id="out"></pre>
  <progress id="prog" max="1000" value="0"></progress>
  <div id="sum"></div>
  <div class="hint" id="rec"></div>
</section>
</main>

<script>
"use strict";
const $=s=>document.querySelector(s);
const MAX_BITS=200000, MAX_STEPS=1e6, VERIFIED=2n**68n;
const ST={ok:'llega a 1 ✔',cycle:'entra en un BUCLE ✘ (¡contraejemplo!)',limit:'límite de pasos alcanzado (inconcluso)'};

/* ---------- utilidades ---------- */
function parseNum(t){
  const c=t.trim().replace(/\^/g,'**').replace(/[ ,._]/g,'');
  if(!c) throw Error('Campo vacío');
  if(c.length>100000) throw Error('Entrada demasiado larga');
  const m=c.match(/^([+-]?\d+)(?:\*\*(\d+))?([+-]\d+)?$/);
  if(!m) throw Error('Formato no válido');
  let v=BigInt(m[1]);
  if(m[2]!==undefined){
    const e=m[2].length<9?Number(m[2]):Infinity;
    const bl=Math.max((v<0n?-v:v).toString(2).length,1);
    if(e*bl>MAX_BITS) throw Error('Número demasiado grande');
    v=v**BigInt(e);
  }
  if(m[3]) v+=BigInt(m[3]);
  if(v.toString(2).length>MAX_BITS) throw Error('Número demasiado grande');
  return v;
}
function fmt(n){
  const s=n.toString();
  if(s.length<=12) return s.replace(/\B(?=(\d{3})+(?!\d))/g,'.');
  return s[0]+'.'+s.slice(1,4)+'e+'+(s.length-1);
}
function log10Big(v){
  const s=v.toString();
  return s.length<=15?Math.log10(Number(s)):s.length-15+Math.log10(Number(s.slice(0,15)));
}

/* ---------- núcleo (Brent para bucles, pasos acelerados) ---------- */
function trajectory(n){
  const v=[n]; let tort=n,pow=1,lam=0;
  while(n!==1n){
    if(v.length>MAX_STEPS) return {v,st:'limit'};
    n=(n&1n)?3n*n+1n:n>>1n; v.push(n);
    if(n===1n) break;
    lam++; if(n===tort) return {v,st:'cycle'};
    if(lam===pow){tort=n;pow*=2;lam=0}
  }
  return {v,st:'ok'};
}
function analyze(n){
  let steps=0,peak=n;
  while(!(n&1n)){n>>=1n;steps++}
  let tort=n,pow=1,lam=0;
  while(n!==1n){
    if(steps>MAX_STEPS) return {st:'limit',steps,peak};
    let t=3n*n+1n; if(t>peak) peak=t; steps++;
    while(!(t&1n)){t>>=1n;steps++}
    n=t; lam++;
    if(n===tort) return {st:'cycle',steps,peak};
    if(lam===pow){tort=n;pow*=2;lam=0}
  }
  return {st:'ok',steps,peak};
}
function verifyFast(n){
  if(n===1n||!(n&1n)) return {st:'ok'};
  const start=n; let steps=0,tort=n,pow=1,lam=0;
  for(;;){
    let t=3n*n+1n; steps++;
    while(!(t&1n)){t>>=1n;steps++}
    n=t;
    if(n<start) return {st:'ok'};
    lam++;
    if(n===tort) return {st:'cycle'};
    if(steps>MAX_STEPS) return {st:'limit'};
    if(lam===pow){tort=n;pow*=2;lam=0}
  }
}

/* ---------- pestañas ---------- */
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.tabs button').forEach(x=>x.setAttribute('aria-selected',x===b));
  $('#seq').hidden=b.dataset.tab!=='seq'; $('#rng').hidden=b.dataset.tab!=='rng';
  if(b.dataset.tab==='seq') draw();
});

/* ---------- gráfica ---------- */
let seq=[],pts=[],geo=null;
const col=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();

function compute(){
  let n;
  try{ n=parseNum($('#n').value); if(n<1n) throw Error('Debe ser un entero positivo'); }
  catch(e){ $('#info').textContent='⚠ '+e.message; return; }
  const t=trajectory(n); seq=t.v;
  let peak=seq[0]; for(const v of seq) if(v>peak) peak=v;
  $('#info').textContent=`Inicio: ${fmt(n)}  |  Pasos: ${(seq.length-1).toLocaleString('es-ES')}  |  Máximo: ${fmt(peak)} (${peak.toString().length} dígitos)  |  ${ST[t.st]}`;
  draw();
}

function draw(){
  const wrap=$('#plot'),cv=$('#cv'),ov=$('#ov'),dpr=window.devicePixelRatio||1;
  const w=wrap.clientWidth,h=wrap.clientHeight; if(!w||!h) return;
  for(const c of [cv,ov]){c.width=w*dpr;c.height=h*dpr}
  const x=cv.getContext('2d'); x.setTransform(dpr,0,0,dpr,0,0);
  ov.getContext('2d').setTransform(dpr,0,0,dpr,0,0);
  pts=[]; geo=null; if(!seq.length) return;
  const L=72,R=18,T=24,B=38,W=w-L-R,H=h-T-B; if(W<40||H<40) return;
  const n=seq.length-1; let peak=seq[0],ip=0;
  seq.forEach((v,i)=>{if(v>peak){peak=v;ip=i}});
  const log=$('#log').checked, lm=peak>1n?log10Big(peak):1;
  const fy=v=>log?(v>1n?log10Big(v)/lm:0):Number(v*10000n/peak)/10000;
  const px=i=>n>0?L+i/n*W:L+W/2, py=v=>T+H-fy(v)*H;
  const fg=col('--muted'),grid=col('--grid'),acc=col('--accent');
  x.font='11px system-ui,sans-serif'; x.fillStyle=fg; x.strokeStyle=grid; x.lineWidth=1;
  x.textAlign='right'; x.textBaseline='middle';
  for(let k=0;k<5;k++){
    const y=T+H-k/4*H; x.beginPath(); x.moveTo(L,y); x.lineTo(L+W,y); x.stroke();
    x.fillText(log?`10^${(k/4*lm).toFixed(1)}`:fmt(peak*BigInt(k)/4n),L-8,y);
  }
  x.textAlign='center'; x.textBaseline='top';
  for(let k=0;k<6;k++){const i=Math.round(n*k/5); x.fillText(i,px(i),T+H+6)}
  x.strokeStyle=fg; x.beginPath(); x.moveTo(L,T); x.lineTo(L,T+H); x.lineTo(L+W,T+H); x.stroke();
  x.fillText('Paso',L+W/2,h-14);

  pts=seq.map((v,i)=>[px(i),py(v)]);
  x.strokeStyle=acc; x.lineWidth=2; x.lineJoin='round'; x.beginPath();
  if(pts.length>W*3){ // decimado: mínimo y máximo por columna
    const cols=new Map();
    for(const [a,b] of pts){const k=Math.round(a),e=cols.get(k); if(!e) cols.set(k,[b,b]); else{if(b<e[0])e[0]=b; if(b>e[1])e[1]=b}}
    x.moveTo(pts[0][0],pts[0][1]);
    for(const [k,e] of cols){x.lineTo(k,e[0]);x.lineTo(k,e[1])}
  } else pts.forEach(([a,b],i)=>i?x.lineTo(a,b):x.moveTo(a,b));
  x.stroke();
  if(pts.length<=300){x.fillStyle=acc; for(const [a,b] of pts){x.beginPath();x.arc(a,b,2.4,0,7);x.fill()}}
  x.font='bold 11px system-ui,sans-serif'; x.textBaseline='alphabetic';
  [[0,col('--ok'),'Inicio'],[ip,col('--bad'),'Máximo'],[n,col('--warn'),'Final']].forEach(([i,c,t])=>{
    const [a,b]=pts[i]; x.fillStyle=c; x.beginPath(); x.arc(a,b,6,0,7); x.fill();
    x.textAlign='center'; x.fillText(t,a,b-12);
  });
  geo={L,W,n,w,h};
}

$('#ov').addEventListener('pointermove',e=>{
  if(!geo||!pts.length) return;
  const r=e.target.getBoundingClientRect(),{L,W,n,w,h}=geo;
  const i=n===0?0:Math.max(0,Math.min(n,Math.round((e.clientX-r.left-L)/W*n)));
  const [a,b]=pts[i],o=$('#ov').getContext('2d');
  o.clearRect(0,0,w,h); o.strokeStyle=col('--muted'); o.setLineDash([4,4]);
  o.beginPath(); o.moveTo(a,0); o.lineTo(a,h); o.stroke(); o.setLineDash([]);
  o.strokeStyle=col('--fg'); o.lineWidth=2; o.beginPath(); o.arc(a,b,5,0,7); o.stroke();
  $('#hov').textContent=`Paso ${i}: ${fmt(seq[i])}`;
});
$('#ov').addEventListener('pointerleave',()=>{if(geo)$('#ov').getContext('2d').clearRect(0,0,geo.w,geo.h)});
$('#go').onclick=compute;
$('#n').addEventListener('keydown',e=>{if(e.key==='Enter')compute()});
$('#log').onchange=draw;
let rz; const redraw=()=>{clearTimeout(rz);rz=setTimeout(draw,60)};
addEventListener('resize',redraw);
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',redraw);

/* ---------- rango (por bloques, sin bloquear la página) ---------- */
let cur=null;
function startRange(){
  let ini,fin;
  try{ini=parseNum($('#ini').value);fin=parseNum($('#fin').value)}
  catch(e){$('#sum').textContent='⚠ '+e.message;return}
  if(ini<1n||ini>fin){$('#sum').textContent='⚠ El inicio debe ser ≥ 1 y ≤ al final.';return}
  let fast=$('#fast').checked, note='';
  if(fast&&ini>VERIFIED){fast=false;note=' (modo rápido desactivado: «Desde» supera 2^68)'}
  const showOk=$('#showok').checked, total=Number(fin-ini+1n);
  const S={n:0,ok:0,cyc:0,lim:0,ls:null,ln:-1,ps:null,pk:0n}, lines=[];
  let n=ini,last=0,shown=0; const t0=performance.now(), me=cur={stop:false};
  $('#run').disabled=true; $('#stop').disabled=false; $('#out').textContent='';
  function ui(msg){
    const el=(performance.now()-t0)/1000;
    $('#prog').value=Math.min(1000,S.n/total*1000);
    $('#sum').textContent=`Comprobados: ${S.n.toLocaleString('es-ES')} de ${fmt(fin-ini+1n)}  |  V: ${S.ok.toLocaleString('es-ES')}  |  Bucles: ${S.cyc}  |  Inconclusos: ${S.lim}  |  ${el.toFixed(1)} s (${Math.round(S.n/Math.max(el,1e-3)).toLocaleString('es-ES')}/s)`+note+(msg?'  |  '+msg:'');
    const rec=[]; if(S.ls!==null) rec.push(`Órbita más larga: ${fmt(S.ls)} (${S.ln.toLocaleString('es-ES')} pasos)`);
    if(S.ps!==null) rec.push(`Pico más alto: ${fmt(S.pk)} (desde ${fmt(S.ps)})`);
    $('#rec').textContent=rec.join('  |  ');
    const o=$('#out'); o.textContent=(lines.length>500?'… (se muestran las últimas 500 líneas)\n':'')+lines.slice(-500).join('\n'); o.scrollTop=o.scrollHeight;
  }
  function done(msg){$('#run').disabled=false;$('#stop').disabled=true;ui(msg)}
  (function tick(){
    if(me.stop) return done('Detenido.');
    const end=performance.now()+14; let c=0;
    while(n<=fin){
      const r=fast?verifyFast(n):analyze(n); S.n++;
      if(r.st==='ok'){
        S.ok++;
        if(r.steps!==undefined){ if(r.steps>S.ln){S.ln=r.steps;S.ls=n} if(r.peak>S.pk){S.pk=r.peak;S.ps=n} }
        if(showOk&&shown<20000){shown++;lines.push(`${n}: V`+(r.steps!==undefined?`  pasos=${r.steps}  pico=${fmt(r.peak)}`:''))}
      } else if(r.st==='cycle'){S.cyc++;lines.push(`${n}: ✘ BUCLE (¡contraejemplo!)`)}
      else {S.lim++;lines.push(`${n}: ⚠ inconcluso (límite de pasos)`)}
      n++;
      if((++c&63)===0&&performance.now()>end) break;
    }
    const now=performance.now();
    if(n>fin) return done('Completado.'+(showOk&&shown>=20000?' (solo se listan los primeros 20.000 que convergen)':''));
    if(now-last>120){last=now;ui()}
    setTimeout(tick,0);
  })();
}
$('#run').onclick=startRange;
$('#stop').onclick=()=>{if(cur)cur.stop=true};

compute();
</script>
</body>
</html>
